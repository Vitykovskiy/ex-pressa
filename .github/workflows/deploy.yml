name: Deploy Backend Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            PRIMARY_TELEGRAM_TOKEN="$(printf '%s' '${{ secrets.TELEGRAM_BOT_TOKENS }}' | cut -d',' -f1)"

            cd "${{ secrets.VPS_DEPLOY_PATH }}/backend"
            git fetch origin prod
            git checkout -B prod origin/prod

            cat > "${{ secrets.VPS_DEPLOY_PATH }}/deploy/.env.backend" <<EOF
            NODE_ENV=production
            PORT=${{ secrets.PORT }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_NAME=${{ secrets.DB_NAME }}
            AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
            TELEGRAM_BOT_TOKEN=$PRIMARY_TELEGRAM_TOKEN
            TELEGRAM_BOT_TOKENS=${{ secrets.TELEGRAM_BOT_TOKENS }}
            WEB_APP_URL=${{ secrets.WEB_APP_URL }}
            BOT_WEB_APP_URL=${{ secrets.BOT_WEB_APP_URL }}
            SKIP_AUTH=false
            EOF
            chmod 600 "${{ secrets.VPS_DEPLOY_PATH }}/deploy/.env.backend"

            cd "${{ secrets.VPS_DEPLOY_PATH }}/deploy"
            docker-compose build backend
            docker-compose up -d postgres backend

            curl -fsS https://api.216.57.105.133.sslip.io/health >/dev/null
