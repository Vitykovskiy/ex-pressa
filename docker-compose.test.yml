services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ex-pressa-test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 5s
      retries: 10
    # Именованный том намеренно не указан.
    # При `docker compose -f docker-compose.test.yml down` данные уничтожаются,
    # следующий `up` даст чистую тестовую БД.
